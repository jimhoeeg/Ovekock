<html lang="da">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konfigurator – Ove Kock</title>

<!-- ================= OKC START – kopiér herfra og ned til OKC SLUT ================= -->
<div class="okc" id="okc-root" data-okc>
  <noscript>Konfiguratoren kræver JavaScript. Ring til Ove Kock på 76 11 77 77 eller skriv til kock@ovekock.dk.</noscript>

<style>
.okc{
  --okc-primary:#0d2a4a;      /* hovedfarve (navy) – tilpas til Ove Kocks brand */
  --okc-primary-2:#16406e;
  --okc-accent:#f2a900;       /* signalfarve */
  --okc-bg:#f5f7fa;
  --okc-card:#ffffff;
  --okc-text:#14202e;
  --okc-muted:#5b6b7c;
  --okc-border:#d8e0e9;
  --okc-sel:#eaf2fb;
  --okc-ok:#1f7a45;
  --okc-warn:#a34a06;
  --okc-warn-bg:#fff4e5;
  --okc-tip-bg:#eef5ff;
  --okc-rec-bg:#effaf2;
  --okc-radius:12px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--okc-text);background:var(--okc-bg);
  max-width:1200px;margin:0 auto;line-height:1.5;font-size:16px;
  border-radius:var(--okc-radius);overflow:hidden;
}
.okc *,.okc *::before,.okc *::after{box-sizing:border-box}
:where(.okc) :where(h2,h3,h4,p){margin:0}
:where(.okc) button{font:inherit;color:inherit}
.okc-head{background:var(--okc-primary);color:#fff;padding:20px 28px 16px}
.okc-head-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.okc-brand{font-weight:800;letter-spacing:.02em;font-size:15px;text-transform:uppercase}
.okc-brand span{color:var(--okc-accent)}
.okc-restart{background:none;border:0;color:#c9d6e5;text-decoration:underline;cursor:pointer;font-size:14px;padding:4px}
.okc-progress{margin-top:14px;display:flex;gap:6px}
.okc-progress i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.okc-progress i.on{background:var(--okc-accent)}
.okc-progress-label{margin-top:8px;font-size:13px;color:#c9d6e5}
.okc-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:28px}
.okc-main{min-width:0}
.okc-title{font-size:26px;line-height:1.25;font-weight:800;color:var(--okc-primary)}
.okc-intro{margin-top:8px;color:var(--okc-muted);max-width:62ch}
.okc-q{margin-top:28px}
.okc-q-label{font-weight:700;font-size:17px}
.okc-q-help{color:var(--okc-muted);font-size:14px;margin-top:2px}
.okc-q-err{display:none;color:#b42318;font-size:14px;margin-top:6px;font-weight:600}
.okc-q.err .okc-q-err{display:block}
.okc-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.okc-opt{position:relative;text-align:left;color:var(--okc-text);background:var(--okc-card);border:2px solid var(--okc-border);border-radius:var(--okc-radius);padding:14px 14px 12px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .05s;display:flex;flex-direction:column;gap:4px}
.okc-opt:hover:not(:disabled){border-color:var(--okc-primary-2)}
.okc-opt:focus-visible{outline:3px solid var(--okc-accent);outline-offset:2px}
.okc-opt[aria-checked="true"]{border-color:var(--okc-primary);background:var(--okc-sel);box-shadow:0 0 0 1px var(--okc-primary)}
.okc-opt:disabled{cursor:not-allowed;opacity:.55;background:#f1f3f6}
.okc-opt-l{font-weight:700;padding-right:22px}
.okc-opt-d{font-size:14px;color:var(--okc-muted)}
.okc-opt-dis{font-size:13px;color:#b42318;font-weight:600}
.okc-opt-check{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;border:2px solid var(--okc-border);background:#fff}
.okc-opt.multi .okc-opt-check{border-radius:5px}
.okc-opt[aria-checked="true"] .okc-opt-check{background:var(--okc-primary);border-color:var(--okc-primary)}
.okc-opt[aria-checked="true"] .okc-opt-check::after{content:"";position:absolute;left:5px;top:1px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.okc-rec{position:absolute;top:-10px;left:12px;background:var(--okc-accent);color:#1c1300;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.okc-lvl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--okc-muted);margin-top:4px}
.okc-lvl b{display:inline-flex;gap:2px}
.okc-lvl b i{width:7px;height:7px;border-radius:2px;background:var(--okc-border)}
.okc-lvl b i.on{background:var(--okc-primary-2)}
.okc-prod{align-items:stretch}
.okc-prod svg{width:100%;height:auto;margin-bottom:6px}
.okc-input{width:100%;max-width:320px;margin-top:10px;padding:12px 14px;border:2px solid var(--okc-border);border-radius:10px;font:inherit;background:#fff;color:var(--okc-text)}
.okc-input:focus{outline:none;border-color:var(--okc-primary)}
.okc-notes{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.okc-note{border-radius:10px;padding:12px 14px;font-size:14px;border-left:4px solid}
.okc-note b{display:block;margin-bottom:2px}
.okc-note.tip{background:var(--okc-tip-bg);border-color:#3b7dd8}
.okc-note.warn{background:var(--okc-warn-bg);border-color:#e08a00;color:#4a2a00}
.okc-note.rec{background:var(--okc-rec-bg);border-color:var(--okc-ok)}
.okc-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:32px;padding-top:20px;border-top:1px solid var(--okc-border)}
.okc-btn{border:0;border-radius:999px;padding:13px 26px;font-weight:700;cursor:pointer;font-size:16px}
.okc-btn-primary{background:var(--okc-primary);color:#fff}
.okc-btn-primary:hover{background:var(--okc-primary-2)}
.okc-btn-accent{background:var(--okc-accent);color:#1c1300}
.okc-btn-accent:hover{filter:brightness(1.05)}
.okc-btn-ghost{background:transparent;color:var(--okc-primary);padding-left:4px;padding-right:4px}
.okc-btn-ghost:hover{text-decoration:underline}
.okc-btn:disabled{opacity:.6;cursor:wait}
.okc-side{display:flex;flex-direction:column;gap:16px}
.okc-card{background:var(--okc-card);border:1px solid var(--okc-border);border-radius:var(--okc-radius);padding:16px}
.okc-card h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--okc-muted);margin-bottom:10px}
.okc-viz svg{width:100%;height:auto;display:block}
.okc-sum{list-style:none;margin:0;padding:0;font-size:14px}
.okc-sum li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--okc-border)}
.okc-sum li:last-child{border-bottom:0}
.okc-sum span{color:var(--okc-muted)}
.okc-sum strong{text-align:right;font-weight:600}
.okc-info ul{margin:0;padding-left:18px;font-size:14px}
.okc-info li{margin-bottom:8px}
.okc-teaser{background:var(--okc-primary);color:#fff;border:0}
.okc-teaser h4{color:#c9d6e5}
.okc-teaser p{font-size:14px}
.okc-teaser .okc-big{font-size:20px;font-weight:800;color:var(--okc-accent);margin-bottom:4px}
/* Prisindikation */
.okc-price-hero{margin-top:20px;background:var(--okc-primary);color:#fff;border-radius:var(--okc-radius);padding:24px}
.okc-price-hero small{color:#c9d6e5;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.okc-price-val{font-size:34px;font-weight:800;color:var(--okc-accent);line-height:1.15;margin:4px 0}
.okc-price-sub{color:#dbe5f0;font-size:14px}
.okc-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
.okc-kpi{background:rgba(255,255,255,.08);border-radius:10px;padding:12px}
.okc-kpi small{display:block}
.okc-kpi strong{font-size:18px}
.okc-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px;background:#fff;border-radius:10px;overflow:hidden}
.okc-table th,.okc-table td{padding:9px 12px;border-bottom:1px solid var(--okc-border);text-align:left;vertical-align:top}
.okc-table td:last-child,.okc-table th:last-child{text-align:right;white-space:nowrap}
.okc-table th{background:#eef2f6;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--okc-muted)}
.okc-h3{font-size:18px;font-weight:800;color:var(--okc-primary);margin-top:28px}
.okc-list{margin:8px 0 0;padding-left:20px;font-size:15px}
.okc-list li{margin-bottom:6px}
.okc-cta{margin-top:28px;background:#fff;border:2px solid var(--okc-accent);border-radius:var(--okc-radius);padding:20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.okc-cta p{max-width:52ch}
.okc-fine{font-size:12px;color:var(--okc-muted);margin-top:14px}
/* Formular */
.okc-form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.okc-field{display:flex;flex-direction:column;gap:4px}
.okc-field.full{grid-column:1/-1}
.okc-field label{font-weight:600;font-size:14px}
.okc-field .okc-input{max-width:none;margin-top:0}
.okc-field.err .okc-input{border-color:#b42318}
.okc-field .okc-q-err{font-size:13px}
.okc-field.err .okc-q-err{display:block}
.okc-field .okc-check{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:400}
.okc-check input{margin-top:3px;width:18px;height:18px;flex:none}
.okc-seg{display:flex;flex-wrap:wrap;gap:8px}
.okc-seg button{color:var(--okc-text);border:2px solid var(--okc-border);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.okc-seg button[aria-checked="true"]{border-color:var(--okc-primary);background:var(--okc-sel)}
.okc-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.okc-alert{margin-top:16px;padding:12px 14px;border-radius:10px;background:#fdecea;color:#7a1610;font-size:14px}
.okc-done-ref{display:inline-block;margin-top:12px;background:var(--okc-sel);border-radius:8px;padding:6px 12px;font-weight:700;color:var(--okc-primary)}
.okc-steps{counter-reset:s;list-style:none;padding:0;margin:16px 0 0}
.okc-steps li{counter-increment:s;position:relative;padding:0 0 14px 44px}
.okc-steps li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--okc-primary);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.okc-print-only{display:none}
@media (max-width:920px){
  .okc-grid{grid-template-columns:1fr;padding:20px 16px}
  .okc-head{padding:16px}
  .okc-side{order:2}
  .okc-title{font-size:22px}
  .okc-price-val{font-size:28px}
}
@media (max-width:560px){
  .okc-form{grid-template-columns:1fr}
  .okc-opts{grid-template-columns:1fr}
  .okc-nav{flex-direction:column-reverse;align-items:stretch}
  .okc-nav .okc-btn{width:100%}
}
@media print{
  body *{visibility:hidden}
  .okc,.okc *{visibility:visible}
  .okc{position:absolute;left:0;top:0;width:100%;max-width:none;background:#fff}
  .okc-nav,.okc-restart,.okc-progress,.okc-progress-label,.okc-noprint{display:none!important}
  .okc-grid{grid-template-columns:1fr}
  .okc-print-only{display:block}
  .okc-head{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

  var S = { product: null, a: {}, lead: { contactPref: 'call' }, step: 0, ref: null, sent: false };
  var root;

  function P() { return S.product ? PRODUCTS[S.product] : null; }
  function save() { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(S)); } catch (e) {} }
  function load() {
    try {
      var raw = localStorage.getItem(CONFIG.storageKey);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && typeof d === 'object' && !d.sent && d.a) { S = d; if (!S.lead) S.lead = { contactPref: 'call' }; }
    } catch (e) {}
  }
  function reset() {
    S = { product: null, a: {}, lead: { contactPref: 'call' }, step: 0, ref: null, sent: false };
    try { localStorage.removeItem(CONFIG.storageKey); } catch (e) {}
    track('restart');
    render(true);
  }

  function screens() {
    var l = ['product'];
    if (S.product) {
      l = l.concat(P().screens);
      if (P().chassis) l.push('chassis');
      l.push('extras', 'project', 'price', 'lead', 'done');
    }
    return l;
  }
  function curScreen() { var l = screens(); if (S.step >= l.length) S.step = l.length - 1; return l[S.step]; }

  function qsOf(sid) {
    var ids = sid === 'extras' ? ['ex_' + S.product] : (SCREENS[sid].qs || []);
    return ids.filter(function (id) { var q = Q[id]; return q && (!q.showIf || q.showIf()); });
  }
  function opt(qid, v) { var q = Q[qid]; if (!q || !q.opts) return null; for (var i = 0; i < q.opts.length; i++) if (q.opts[i].v === v) return q.opts[i]; return null; }

  // Fjern valg der er blevet ugyldige pga. andre valg
  function sanitize() {
    var changed = false;
    Object.keys(Q).forEach(function (id) {
      var q = Q[id]; if (!q.opts) return;
      var cur = S.a[id];
      if (Array.isArray(cur)) {
        var keep = cur.filter(function (v) { var o = opt(id, v); return o && !(o.dis && o.dis()); });
        if (keep.length !== cur.length) { S.a[id] = keep; changed = true; }
      } else if (cur) {
        var o = opt(id, cur);
        if (!o || (o.dis && o.dis())) { delete S.a[id]; changed = true; }
      }
    });
    return changed;
  }

  /* =====================================================================
     5. PRIS- OG TIDSBEREGNING
     ===================================================================== */
  function estimate() {
    var g = { body: [0, 0], chassis: [0, 0], trailer: [0, 0] }, lines = [], extraW = [0, 0];
    var own = A('ch_source') === 'own';
    screens().forEach(function (sid) {
      if (['product', 'project', 'price', 'lead', 'done'].indexOf(sid) > -1) return;
      qsOf(sid).forEach(function (id) {
        var q = Q[id]; if (!q.opts) return;
        var sel = S.a[id]; var arr = Array.isArray(sel) ? sel : (sel ? [sel] : []);
        arr.forEach(function (v) {
          var o = opt(id, v); if (!o) return;
          if (o.w) { extraW[0] += o.w[0]; extraW[1] += o.w[1]; }
          if (!o.p) return;
          var grp = q.group || 'body';
          if (grp === 'chassis' && own) return;
          g[grp][0] += o.p[0]; g[grp][1] += o.p[1];
          if (o.p[1] > 0) lines.push({ grp: grp, label: (q.short || q.label) + ': ' + o.l, p: o.p });
        });
      });
    });
    // Montage, klargøring og levering
    if (S.product !== 'lift') { g.body[0] += 40000; g.body[1] += 90000; lines.push({ grp: 'body', label: 'Montage, klargøring, syn og levering', p: [40000, 90000] }); }
    else { g.body[0] += 5000; g.body[1] += 15000; lines.push({ grp: 'body', label: 'Montage og godkendelse', p: [5000, 15000] }); }

    var lo = g.body[0] + g.chassis[0] + g.trailer[0];
    var hi = g.body[1] + g.chassis[1] + g.trailer[1];
    lo = roundP(lo); hi = roundP(hi);

    var bw = P().weeks;
    var cw = (!P().chassis || own) ? [0, 0] : (A('drive') === 'el' ? [26, 52] : [16, 30]);
    var weeks;
    if (P().chassis) weeks = [Math.max(bw[0], cw[0]) + CONFIG.assemblyWeeks[0] + extraW[0], Math.max(bw[1], cw[1]) + CONFIG.assemblyWeeks[1] + extraW[1]];
    else weeks = [bw[0] + extraW[0], bw[1] + extraW[1]];

    var L = CONFIG.leasing;
    var monthly = [pmt(lo), pmt(hi)].map(function (x) { return Math.round(x / 500) * 500; });
    function pmt(pv) {
      var r = L.rate / 12, n = L.months, fv = pv * L.residual;
      return (pv - fv / Math.pow(1 + r, n)) * r / (1 - Math.pow(1 + r, -n));
    }
    var qtyMul = { '1': [1, 1], '2-3': [2, 3], '4+': [4, 4] }[A('qty')] || [1, 1];
    return { lo: lo, hi: hi, g: g, lines: lines, weeks: weeks, monthly: monthly, qtyMul: qtyMul, own: own };
  }
  function roundP(n) { var step = n >= 500000 ? 25000 : (n >= 100000 ? 5000 : 1000); return Math.round(n / step) * step; }
  function fmtKr(n) { return Math.round(n).toLocaleString('da-DK') + ' kr.'; }
  function fmtRange(lo, hi) {
    if (hi >= 1000000) {
      var f = function (x) { return (x / 1000000).toLocaleString('da-DK', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
      return f(lo) + '–' + f(hi) + ' mio. kr.';
    }
    return Math.round(lo).toLocaleString('da-DK') + '–' + Math.round(hi).toLocaleString('da-DK') + ' kr.';
  }
  function weeksToText(w) {
    var m0 = Math.max(1, Math.round(w[0] / 4.33)), m1 = Math.max(1, Math.round(w[1] / 4.33));
    if (w[1] <= 10) return w[0] + '–' + w[1] + ' uger';

  }

      var tl = A('sug_tank') === 'l' ? 286 : A('sug_tank') === 's' ? 230 : 260;
      s += '<rect x="' + (400 - tl) + '" y="44" width="' + tl + '" height="72" rx="36" fill="' + C.body + '"/>';
      s += '<rect x="112" y="70" width="' + (400 - tl - 116) + '" height="46" rx="4" fill="' + C.body2 + '"/>';
      s += '<path d="M' + (420 - tl) + ' 44 L' + (420 - tl) + ' 26 L300 20" fill="none" stroke="' + C.acc + '" stroke-width="7" stroke-linecap="round"/>';
      s += '<circle cx="396" cy="80" r="10" fill="' + C.acc + '"/>';
    } else if (p === 'lift') {
      s += '<rect x="110" y="30" width="276" height="90" rx="4" fill="' + C.body + '"/>';
      if (A('lift_type') === 'fold') s += '<rect x="360" y="124" width="40" height="10" rx="2" fill="' + C.acc + '"/>';
      else s += '<rect x="388" y="34" width="8" height="86" fill="' + C.acc + '"/>';
    }
    // hjul
    var front = ax === 4 ? [62, 112] : [64];
    var rearX = ax === 2 ? [330] : ax === 3 ? [306, 352] : [318, 364];
    front.concat(rearX).forEach(function (x) { s += wheel(x, 138); });
    if (el) s += '<g><circle cx="66" cy="' + (cabTop + 62) + '" r="13" fill="' + C.acc + '"/><path d="M68 ' + (cabTop + 52) + ' l-8 12 h6 l-3 10 9-13 h-6z" fill="#1c1300"/></g>';
    return s + '</svg>';

    function wheel(x, y) { return '<circle cx="' + x + '" cy="' + y + '" r="17" fill="' + C.wheel + '"/><circle cx="' + x + '" cy="' + y + '" r="7" fill="#8b96a3"/>'; }
    function ribs(x, w, y1, y2) { var r = ''; for (var i = x + 20; i < x + w - 10; i += 22) r += '<line x1="' + i + '" y1="' + (y1 + 6) + '" x2="' + i + '" y2="' + (y2 - 6) + '"/>'; return r; }
  }

  /* =====================================================================
     9. RENDERING
     ===================================================================== */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function render(scrollTop) {
    if (sanitize()) { /* valg fjernet pga. regler */ }
    var sid = curScreen(), list = screens();
    var flowLen = S.product ? list.length - 1 : 8; // "done" tæller ikke
    var idx = Math.min(S.step, flowLen - 1);
    var h = '';
    h += '<div class="okc-head"><div class="okc-head-top"><div class="okc-brand">Ove Kock <span>·</span> Konfigurator</div>';
    if (S.step > 0 && sid !== 'done') h += '<button type="button" class="okc-restart" data-act="restart">Start forfra</button>';
    h += '</div>';
    if (sid !== 'done') {
      h += '<div class="okc-progress" aria-hidden="true">';
      for (var i = 0; i < flowLen; i++) h += '<i class="' + (i <= idx ? 'on' : '') + '"></i>';
      h += '</div><div class="okc-progress-label">Trin ' + (idx + 1) + ' af ' + flowLen + (sid === 'price' ? ' – din prisindikation er klar' : (list.indexOf('price') > S.step ? ' · prisindikation om ' + (list.indexOf('price') - S.step) + ' trin' : '')) + '</div>';
    }
    h += '</div>';
    h += '<div class="okc-grid"><div class="okc-main" id="okc-main">';
    if (sid === 'price') h += renderPrice();
    else if (sid === 'lead') h += renderLead();
    else if (sid === 'done') h += renderDone();
    else h += renderQuestions(sid);
    h += '</div><aside class="okc-side">' + renderSide(sid) + '</aside></div>';
    root.innerHTML = h;
    save();
    postHeight();
    if (scrollTop) {
      try {
        var top = root.getBoundingClientRect().top + window.pageYOffset - 20;
        if (root.getBoundingClientRect().top < 0) window.scrollTo({ top: top, behavior: 'smooth' });
      } catch (e) {}
      var t = root.querySelector('.okc-title'); if (t) { t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); }
    }
  }

  function renderQuestions(sid) {
    var sc = SCREENS[sid], h = '';
    h += '<h2 class="okc-title">' + esc(sc.title) + '</h2>';
    if (sc.intro) h += '<p class="okc-intro">' + esc(sc.intro) + '</p>';
    qsOf(sid).forEach(function (id) { h += renderQ(id); });
    var notes = advice().filter(function (n) { return n.s === sid; });
    if (notes.length) {
      h += '<div class="okc-notes" aria-live="polite">';
      notes.forEach(function (n) { h += '<div class="okc-note ' + n.t + '"><b>' + (n.t === 'warn' ? 'Vær opmærksom: ' : n.t === 'rec' ? 'Vores anbefaling: ' : 'Godt at vide: ') + esc(n.h) + '</b>' + esc(n.m) + '</div>'; });
      h += '</div>';
    }
    h += '<div class="okc-nav">';
    h += S.step > 0 ? '<button type="button" class="okc-btn okc-btn-ghost" data-act="back">← Tilbage</button>' : '<span></span>';
    var nextLabel = screens()[S.step + 1] === 'price' ? 'Se prisindikation →' : 'Næste →';
    if (sid === 'product') nextLabel = 'Kom i gang →';
    h += '<button type="button" class="okc-btn okc-btn-primary" data-act="next">' + nextLabel + '</button></div>';
    return h;
  }

  function renderQ(id) {
    var q = Q[id], h = '<div class="okc-q" id="okc-q-' + id + '">';
    if (q.type === 'product') {
      h += '<div class="okc-opts" role="radiogroup" aria-label="Vælg løsning">';

        var pr = PRODUCTS[k], on = S.product === k;
        h += '<button type="button" class="okc-opt okc-prod" role="radio" aria-checked="' + on + '" data-q="product" data-v="' + k + '"><span class="okc-opt-check"></span>' +
          truckSVG(k, { mini: true, axles: k === 'lift' ? '2' : '3', vehicle: 'truck' }) +
          '<span class="okc-opt-l">' + esc(pr.name) + '</span><span class="okc-opt-d">' + esc(pr.desc) + '</span></button>';
      });

    }

    if (q.help) h += '<div class="okc-q-help">' + esc(q.help) + '</div>';

      h += '<div class="okc-q-err">' + esc(q.err) + '</div></div>';
      return h;
    }
    h += '<div class="okc-opts" role="' + (q.type === 'multi' ? 'group' : 'radiogroup') + '" aria-label="' + esc(q.label) + '">';
    q.opts.forEach(function (o) {

      if (rec) h += '<span class="okc-rec">Anbefalet</span>';
      h += '<span class="okc-opt-check"></span><span class="okc-opt-l">' + esc(o.l) + '</span>';
      if (o.d) h += '<span class="okc-opt-d">' + esc(o.d) + '</span>';
      if (dis) h += '<span class="okc-opt-dis">' + esc(dis) + '</span>';
      if (o.p && lvl > 0) {
        h += '<span class="okc-lvl" title="Relativ påvirkning af prisen">Prisniveau <b>';
        for (var i = 1; i <= 4; i++) h += '<i class="' + (i <= lvl ? 'on' : '') + '"></i>';
        h += '</b></span>';
      } else if (o.p && o.p[1] === 0) h += '<span class="okc-lvl">Inkluderet i grundpris</span>';
      h += '</button>';
    });
    h += '</div><div class="okc-q-err">Vælg en mulighed.</div></div>';
    return h;
  }

  function summaryItems() {
    var items = [];
    if (S.product) items.push(['Løsning', P().name]);
    screens().forEach(function (sid) {
      if (['product', 'price', 'lead', 'done'].indexOf(sid) > -1) return;
      qsOf(sid).forEach(function (id) {
        var q = Q[id], v = S.a[id];
        if (v == null || (Array.isArray(v) && !v.length)) return;
        var label;
        if (q.type === 'text') label = v;
        else if (Array.isArray(v)) label = v.map(function (x) { var o = opt(id, x); return o ? o.l : x; }).join(', ');
        else { var o = opt(id, v); label = o ? o.l : v; }
        items.push([q.short || q.label, label]);
      });
    });
    return items;
  }

  function validateScreen(sid) {
    var ok = true, first = null;
    if (sid === 'product') {
      if (!S.product) { ok = false; first = root.querySelector('#okc-q-product'); }
    } else {
      qsOf(sid).forEach(function (id) {
        var q = Q[id], v = S.a[id], bad = false;
        if (q.optional) return;
        if (q.type === 'text') bad = !(q.pattern ? q.pattern.test(v || '') : v);
        else if (q.type === 'single') bad = !v;
        var el = root.querySelector('#okc-q-' + id);
        if (el) el.classList.toggle('err', bad);
        if (bad) { ok = false; if (!first) first = el; }
      });
    }
    if (first) {
      first.classList.add('err');
      try { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
    }
    return ok;
  }

  function validateLead() {
    var L = S.lead, errs = {};
    if (!L.name || L.name.trim().length < 2) errs.name = 1;
    if (!L.company || L.company.trim().length < 2) errs.company = 1;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((L.email || '').trim())) errs.email = 1;
    if ((L.phone || '').replace(/\D/g, '').length < 8) errs.phone = 1;
    if (!L.role) errs.role = 1;
    if (!L.consent) errs.consent = 1;
    ['name', 'company', 'email', 'phone', 'role', 'consent'].forEach(function (k) {
      var el = root.querySelector('#okc-f-' + k); if (el) el.classList.toggle('err', !!errs[k]);
    });
    var keys = Object.keys(errs);
    if (keys.length) {
      var el = root.querySelector('#okc-f-' + keys[0]);
      if (el) { try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {} var inp = el.querySelector('input,select'); if (inp) inp.focus({ preventScroll: true }); }
    }
    return !keys.length;
  }

  function go(delta) {
    var sid = curScreen();
    if (delta > 0 && sid !== 'price' && !validateScreen(sid)) { track('validation_error', { okc_screen: sid }); return; }
    S.step = Math.max(0, Math.min(screens().length - 1, S.step + delta));
    var ns = curScreen();
    track(delta > 0 ? 'step_next' : 'step_back', { okc_screen: ns });
    if (ns === 'price') { var e = estimate(); track('price_shown', { okc_price_low: e.lo, okc_price_high: e.hi }); }
    if (ns === 'lead') track('lead_form_view');
    render(true);
  }

  function makeRef() {
    var d = new Date();
    var r = Math.random().toString(36).slice(2, 6).toUpperCase();
    return 'OK-' + String(d.getFullYear()).slice(2) + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '-' + r;
  }

  function buildPayload() {
    var e = estimate(), sc = leadScore(e), br = branchFor(A('zip'));
    var answers = {};
    summaryItems().forEach(function (it) { answers[it[0]] = it[1]; });
    return {
      reference: S.ref,
      submitted_at: new Date().toISOString(),
      lead: {
        name: S.lead.name, company: S.lead.company, email: S.lead.email, phone: S.lead.phone,
        role: S.lead.role, cvr: S.lead.cvr || null, contact_preference: S.lead.contactPref,
        message: S.lead.msg || null, consent: !!S.lead.consent, marketing_consent: !!S.lead.marketing
      },
      qualification: {
        score: sc.score, grade: sc.grade,
        timeline: A('timeline'), trigger: A('trigger'), quantity: A('qty'), service: A('service'),
        postal_code: A('zip'), nearest_branch: br ? BRANCHES[br].name : null
      },
      configuration: { product: S.product, product_name: P().name, raw: S.a, readable: answers },
      estimate: {
        currency: 'DKK', excl_vat: true, per_unit_low: e.lo, per_unit_high: e.hi,
        chassis_included: !e.own, lead_time_weeks: e.weeks, leasing_monthly: e.monthly,
        lines: e.lines.map(function (l) { return { item: l.label, low: l.p[0], high: l.p[1] }; })
      },
      advice: advice().map(function (n) { return n.t + ': ' + n.h; }),
      attribution: attribution()
    };
  }

  function emailBody(p) {
    var lines = [];
    lines.push('Forespørgsel fra konfiguratoren – ' + p.reference, '');
    lines.push('Navn: ' + p.lead.name, 'Virksomhed: ' + p.lead.company, 'E-mail: ' + p.lead.email, 'Telefon: ' + p.lead.phone, 'Kontakt: ' + p.lead.contact_preference, '');
    Object.keys(p.configuration.readable).forEach(function (k) { lines.push(k + ': ' + p.configuration.readable[k]); });
    lines.push('', 'Vejledende pris: ' + fmtRange(p.estimate.per_unit_low, p.estimate.per_unit_high));
    lines.push('Leadscore: ' + p.qualification.score + ' (' + p.qualification.grade + ')');
    if (p.lead.message) lines.push('', 'Kommentar: ' + p.lead.message);
    return lines.join('\n');
  }

  function submit(btn) {
    if (S.lead.website) return; // honeypot – formentlig spam
    if (!validateLead()) { track('validation_error', { okc_screen: 'lead' }); return; }
    S.ref = S.ref || makeRef();
    var payload = buildPayload();
    var alertBox = root.querySelector('#okc-alert');
    btn.disabled = true; btn.textContent = 'Sender …';

    function success() {
      S.sent = true;
      track('lead_submitted', { okc_reference: S.ref, okc_grade: payload.qualification.grade, okc_score: payload.qualification.score, okc_value_high: payload.estimate.per_unit_high });
      S.step = screens().indexOf('done');
      render(true);
      try { localStorage.removeItem(CONFIG.storageKey); } catch (e) {}
    }
    if (!CONFIG.endpoint) {
      var href = 'mailto:' + CONFIG.fallbackEmail + '?subject=' + encodeURIComponent('Konfigurator: ' + P().name + ' – ' + (S.lead.company || '') + ' (' + S.ref + ')') + '&body=' + encodeURIComponent(emailBody(payload));
      if (CONFIG.debug) console.log('[OKC] payload', payload);
      try { window.location.href = href; } catch (e) {}
      success();
      return;
    }
    fetch(CONFIG.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); success(); })
      .catch(function () {
        btn.disabled = false; btn.textContent = 'Send forespørgsel';
        track('submit_error');
        alertBox.innerHTML = '<div class="okc-alert">Beklager – forespørgslen kunne ikke sendes. Prøv igen, eller ring på 76 11 77 77 / skriv til <a href="mailto:' + esc(CONFIG.fallbackEmail) + '">' + esc(CONFIG.fallbackEmail) + '</a> og oplys reference ' + esc(S.ref) + '.</div>';
      });
  }

  function postHeight() {
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'okc-height', height: document.documentElement.scrollHeight }, '*'); } catch (e) {}
  }

  /* =====================================================================
     11. EVENTS
     ===================================================================== */
  function bind() {
    root.addEventListener('click', function (ev) {
      var t = ev.target.closest('button'); if (!t || !root.contains(t) || t.disabled) return;
      var q = t.getAttribute('data-q'), v = t.getAttribute('data-v'), act = t.getAttribute('data-act'), pref = t.getAttribute('data-pref');
      if (q) {
        if (q === 'product') {
          if (S.product !== v) { S.product = v; S.a = {}; track('product_selected', { okc_product: v }); }
        } else if (Q[q].type === 'multi') {
          var arr = (S.a[q] || []).slice(), i = arr.indexOf(v);
          if (i > -1) arr.splice(i, 1); else arr.push(v);
          S.a[q] = arr;
        } else {
          S.a[q] = v;
        }
        track('answer', { okc_question: q, okc_value: v });
        var y = window.pageYOffset;
        render(false);
        try { window.scrollTo(0, y); } catch (e) {}
        var again = root.querySelector('[data-q="' + q + '"][data-v="' + v + '"]'); if (again) again.focus({ preventScroll: true });
        return;
      }
      if (pref) {
        S.lead.contactPref = pref;
        root.querySelectorAll('[data-pref]').forEach(function (b) { b.setAttribute('aria-checked', String(b.getAttribute('data-pref') === pref)); });
        save(); return;
      }
      if (act === 'next') go(1);
      else if (act === 'back') go(-1);
      else if (act === 'restart') reset();
      else if (act === 'submit') submit(t);
      else if (act === 'print') { track('print_spec'); window.print(); }
    });
    root.addEventListener('input', function (ev) {
      var t = ev.target;
      var k = t.getAttribute('data-in');
      if (k) {
        S.a[k] = t.value.replace(/\D/g, '').slice(0, 4);
        if (t.value !== S.a[k]) t.value = S.a[k];
        var hint = root.querySelector('#okc-branch-hint'), br = branchFor(S.a[k]);
        if (hint) hint.innerHTML = br && S.a[k].length === 4 ? 'Nærmeste afdeling: <b>' + esc(BRANCHES[br].name) + '</b>' : '';
        if (S.a[k].length === 4) { var qe = root.querySelector('#okc-q-' + k); if (qe) qe.classList.remove('err'); }
        save(); return;
      }
      var lk = t.getAttribute('data-lead');
      if (lk) { S.lead[lk] = t.value; var fe = root.querySelector('#okc-f-' + lk); if (fe) fe.classList.remove('err'); save(); }
    });
    root.addEventListener('change', function (ev) {
      var t = ev.target, ck = t.getAttribute('data-lead-check');
      if (ck) { S.lead[ck] = t.checked; var fe = root.querySelector('#okc-f-' + ck); if (fe && t.checked) fe.classList.remove('err'); save(); }
      var lk = t.getAttribute('data-lead');
      if (lk && t.tagName === 'SELECT') { S.lead[lk] = t.value; var fe2 = root.querySelector('#okc-f-' + lk); if (fe2) fe2.classList.remove('err'); save(); }
    });
    root.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && ev.target.getAttribute && ev.target.getAttribute('data-in')) { ev.preventDefault(); go(1); }
    });
    window.addEventListener('resize', postHeight);
  }

  function init() {
    root = document.getElementById('okc-root');
    if (!root) return;
    load();
    bind();
    render(false);
    track('loaded');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
